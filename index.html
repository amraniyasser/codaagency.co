<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Coda Agency — Création de sites web avec une structure pensée pour le SEO, le GEO et les moteurs IA." />
  <title>Coda Agency — Création de sites web</title>

  <style>
    /* 1. TOKENS */
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0066cc;
      --border: rgba(29, 29, 31, 0.10);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --gutter: clamp(32px, 5.5vw, 96px);
      --max: 1440px;
      --nav-h: 88px;
      --radius-pill: 999px;
    }

    /* 2. BASE */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .inner {
      width: min(calc(100% - (var(--gutter) * 2)), var(--max));
      margin-inline: auto;
    }

    /* 3. NAVBAR */
    .nav {
      height: var(--nav-h);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      letter-spacing: -0.04em;
      white-space: nowrap;
    }

    .brand-coda {
      font-size: 34px;
      font-weight: 700;
      line-height: 1;
    }

    .brand-agency {
      font-size: 22px;
      font-weight: 400;
      line-height: 1;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .nav-cta {
      min-height: 48px;
      padding: 0 22px;
      border-radius: var(--radius-pill);
      background: var(--text);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* 4. HERO */
    .hero {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      padding: 56px 0 96px;
    }

    .hero-grid {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(340px, 0.9fr);
      gap: clamp(48px, 8vw, 120px);
      align-items: center;
    }

    .hero-copy {
      max-width: 880px;
    }

    .hero h1 {
      margin: 0;
      max-width: 840px;
      font-size: clamp(64px, 8vw, 128px);
      line-height: 0.92;
      letter-spacing: -0.065em;
      font-weight: 700;
    }

    .hero p {
      margin: 34px 0 0;
      max-width: 690px;
      font-size: clamp(20px, 2.2vw, 30px);
      line-height: 1.18;
      letter-spacing: -0.025em;
      color: var(--muted);
    }

    .hero-actions {
      margin-top: 38px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hero-cta {
      min-height: 54px;
      padding: 0 24px;
      border-radius: var(--radius-pill);
      background: var(--accent);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.015em;
    }

    .hero-note {
      font-size: 14px;
      color: var(--muted);
    }

    .hero-visual {
      position: relative;
      min-height: 520px;
      border-radius: 34px;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .hero-visual::before,
    .hero-visual::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
    }

    .hero-visual::before {
      width: 320px;
      height: 320px;
      top: 36px;
      right: 22px;
      background: radial-gradient(circle, rgba(0,102,204,0.16), rgba(0,102,204,0));
    }

    .hero-visual::after {
      width: 280px;
      height: 280px;
      left: 28px;
      bottom: 16px;
      background: radial-gradient(circle, rgba(110,110,115,0.12), rgba(110,110,115,0));
    }

    .visual-card {
      position: absolute;
      border-radius: 24px;
      background: #fff;
      border: 1px solid var(--border);
      box-shadow: 0 18px 60px rgba(0,0,0,0.08);
    }

    .visual-card.one {
      width: 64%;
      height: 44%;
      left: 8%;
      top: 14%;
      transform: rotate(-5deg);
    }

    .visual-card.two {
      width: 68%;
      height: 48%;
      right: 7%;
      top: 28%;
      transform: rotate(4deg);
    }

    .visual-card.three {
      width: 56%;
      height: 34%;
      left: 18%;
      bottom: 8%;
      transform: rotate(-2deg);
    }

    /* 5. RESPONSIVE */
    @media (max-width: 980px) {
      :root {
        --nav-h: 80px;
      }

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 36px;
      }

      .hero-visual {
        min-height: 420px;
      }
    }

    @media (max-width: 700px) {
      .brand-coda {
        font-size: 28px;
      }

      .brand-agency {
        font-size: 18px;
      }

      .nav-link {
        display: none;
      }

      .nav-cta {
        min-height: 44px;
        padding-inline: 16px;
        font-size: 12px;
      }

      .hero h1 {
        font-size: clamp(54px, 17vw, 86px);
      }

      .hero p {
        margin-top: 24px;
      }

      .hero-visual {
        min-height: 340px;
        border-radius: 26px;
      }
    }
  </style>
</head>

<body>
  <header class="nav">
    <div class="inner nav-inner">
      <a class="brand" href="#top" aria-label="Coda Agency — accueil">
        <span class="brand-coda">Coda</span>
        <span class="brand-agency">Agency</span>
      </a>

      <nav class="nav-actions" aria-label="Navigation principale">
        <a class="nav-link" href="#contact">Contact</a>
        <a class="nav-cta" href="#contact">Parler de votre projet <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="inner hero-grid">
        <div class="hero-copy">
          <h1>Création de sites web.</h1>
          <p>Création de sites web avec une structure parfaitement pensée pour le SEO, le GEO et les moteurs IA.</p>

          <div class="hero-actions">
            <a class="hero-cta" href="#contact">Parler de votre projet</a>
            <span class="hero-note">Sites pensés pour être trouvés, compris et choisis.</span>
          </div>
        </div>

        <div class="hero-visual" aria-hidden="true">
          <div class="visual-card one"></div>
          <div class="visual-card two"></div>
          <div class="visual-card three"></div>
        </div>
      </div>
    </section>

    <section id="contact"></section>
  </main>

  <!-- deployment refresh -->
</body>
</html>
