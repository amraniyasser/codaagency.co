<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Coda Agency — Création de sites web avec une structure pensée pour le SEO, le GEO et les moteurs IA." />
  <title>Coda Agency — Création de sites web</title>
  <style>
    :root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#0066cc;--border:rgba(29,29,31,.10);--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif;--gutter:clamp(48px,5vw,96px);--nav-h:88px;--radius-pill:999px}
    *,*::before,*::after{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}a{color:inherit;text-decoration:none}button{font:inherit}.inner{width:100%;padding-inline:var(--gutter);margin-inline:auto}
    .nav{height:var(--nav-h);display:flex;align-items:center}.nav-inner{width:100%;display:flex;align-items:center;justify-content:space-between;gap:32px}.brand{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;white-space:nowrap}.brand-coda{font-size:24px;font-weight:400;letter-spacing:.22em;padding-left:.22em}.brand-agency{margin-top:6px;font-size:9px;font-weight:500;letter-spacing:.38em;padding-left:.38em}.nav-actions{display:flex;align-items:center;gap:28px}.nav-link{font-size:14px}.nav-cta{min-height:48px;padding:0 22px;border-radius:var(--radius-pill);background:var(--text);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:12px;font-size:14px;font-weight:500}
    .hero-intro{padding-top:clamp(8px,1.2vw,18px);padding-bottom:0;text-align:center}.hero-intro h1{margin:0;font-size:clamp(54px,6.4vw,98px);line-height:.96;letter-spacing:-.055em;font-weight:700;white-space:nowrap}.hero-intro p{margin:14px auto 0;max-width:none;font-size:clamp(14px,1.05vw,17px);line-height:1.35;letter-spacing:-.015em;color:var(--muted);white-space:nowrap}
    .work-scroll{position:relative;height:340vh;margin-top:-52px}.work-stage{position:sticky;top:0;height:100vh;min-height:660px;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;padding-top:0}.radial-slider{position:relative;width:min(1200px,calc(100vw - (var(--gutter) * 2)));height:min(650px,76vh);z-index:1}.radial-card{position:absolute;left:50%;top:39%;width:clamp(320px,37vw,550px);aspect-ratio:1.5/1;border-radius:28px;background:#fff;border:1px solid rgba(29,29,31,.10);box-shadow:0 30px 90px rgba(29,29,31,.12);overflow:hidden;transform-origin:center;will-change:transform,opacity;transition:box-shadow .3s ease,border-color .3s ease}.radial-card img{width:100%;height:100%;display:block;object-fit:cover}.radial-card.is-active{border-color:rgba(29,29,31,.16);box-shadow:0 42px 110px rgba(29,29,31,.18)}.slider-ui{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:14px}.slider-index{min-width:58px;color:var(--muted);font-size:13px;text-align:center;letter-spacing:.04em}.slider-next{border:0;border-radius:var(--radius-pill);background:var(--text);color:#fff;min-height:48px;padding:0 22px;display:inline-flex;align-items:center;gap:12px;cursor:pointer;font-size:14px;font-weight:500;transition:transform .18s ease}.slider-next:hover{transform:translateY(-1px)}
    @media(max-width:980px){:root{--nav-h:80px}.hero-intro h1,.hero-intro p{white-space:normal}.work-scroll{height:300vh;margin-top:-28px}.work-stage{min-height:620px}.radial-slider{height:68vh}}
    @media(max-width:700px){:root{--gutter:24px}.brand-coda{font-size:20px}.brand-agency{margin-top:4px;font-size:7px}.nav-link{display:none}.nav-cta{min-height:44px;padding-inline:16px;font-size:12px}.hero-intro{padding-top:8px}.hero-intro h1{font-size:clamp(42px,12vw,64px)}.hero-intro p{margin-top:12px;font-size:14px}.work-scroll{height:270vh;margin-top:-14px}.work-stage{min-height:560px}.radial-slider{width:calc(100vw - 28px);height:64vh}.radial-card{top:38%;width:min(82vw,380px);border-radius:22px}.slider-ui{bottom:6%}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.radial-card,.slider-next{transition:none}}
  </style>
</head>
<body>
  <header class="nav"><div class="inner nav-inner"><a class="brand" href="#top" aria-label="Coda Agency — accueil"><span class="brand-coda">CODA</span><span class="brand-agency">AGENCY</span></a><nav class="nav-actions" aria-label="Navigation principale"><a class="nav-link" href="#contact">Contact</a><a class="nav-cta" href="#contact">Parler de votre projet <span aria-hidden="true">↗</span></a></nav></div></header>
  <main id="top">
    <section class="hero-intro inner" aria-labelledby="hero-title"><h1 id="hero-title">Création de sites web.</h1><p>Création de sites web avec une structure parfaitement pensée pour le SEO, le GEO et les moteurs IA.</p></section>
    <section class="work-scroll" id="work" aria-label="Aperçu de nos réalisations"><div class="work-stage"><div class="radial-slider" aria-live="polite">
      <article class="radial-card" aria-label="Studio de yoga"><img src="assets/yoga-studio.jpg" alt="Aperçu d'un site web premium pour un studio de yoga"></article>
      <article class="radial-card" aria-label="Café haut de gamme"><img src="assets/cafe-premium.jpg" alt="Aperçu d'un site web premium pour un café haut de gamme"></article>
      <article class="radial-card" aria-label="Villa Airbnb"><img src="assets/villa-airbnb.jpg" alt="Aperçu d'un site web premium pour une villa Airbnb"></article>
      <article class="radial-card" aria-label="Cabinet dentaire"><img src="assets/dentist-premium.jpg" alt="Aperçu d'un site web premium pour un cabinet dentaire"></article>
      <article class="radial-card" aria-label="Magasin de chaussures"><img src="assets/shoe-store.jpg" alt="Aperçu d'un site web premium pour un magasin de chaussures"></article>
    </div><div class="slider-ui"><span class="slider-index" aria-hidden="true">01 / 05</span><button class="slider-next" type="button" aria-label="Voir le projet suivant">Next <span aria-hidden="true">→</span></button></div></div></section>
    <section id="contact"></section>
  </main>
  <script>
    (()=>{const section=document.querySelector('.work-scroll'),cards=[...document.querySelectorAll('.radial-card')],nextButton=document.querySelector('.slider-next'),indexLabel=document.querySelector('.slider-index'),count=cards.length;let scrollIndex=0,activeIndex=0;const clamp=(v,min,max)=>Math.min(Math.max(v,min),max);function setActive(index,smooth=true){activeIndex=((index%count)+count)%count;cards.forEach((card,i)=>{let offset=i-activeIndex;if(offset>count/2)offset-=count;if(offset<-count/2)offset+=count;const angle=offset*23,radians=angle*Math.PI/180,radiusX=innerWidth<700?260:430,radiusY=innerWidth<700?145:220,x=Math.sin(radians)*radiusX,y=(1-Math.cos(radians))*radiusY-Math.abs(offset)*6,rotate=offset*7,scale=1-Math.min(Math.abs(offset)*.09,.28),opacity=clamp(1-Math.abs(offset)*.22,.28,1),z=20-Math.abs(offset);card.style.transition=smooth?'transform 620ms cubic-bezier(.2,.8,.2,1), opacity 420ms ease':'none';card.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) rotate(${rotate}deg) scale(${scale})`;card.style.opacity=opacity;card.style.zIndex=z;card.classList.toggle('is-active',i===activeIndex)});indexLabel.textContent=`${String(activeIndex+1).padStart(2,'0')} / ${String(count).padStart(2,'0')}`}
    function updateFromScroll(){const rect=section.getBoundingClientRect(),scrollable=section.offsetHeight-innerHeight,progress=clamp(-rect.top/scrollable,0,1),nextIndex=Math.round(progress*(count-1));if(nextIndex!==scrollIndex){scrollIndex=nextIndex;setActive(scrollIndex,true)}}
    addEventListener('scroll',updateFromScroll,{passive:true});nextButton.addEventListener('click',()=>setActive((activeIndex+1)%count,true));addEventListener('resize',()=>setActive(activeIndex,false));setActive(0,false);updateFromScroll()})();
  </script>
</body>
</html>
