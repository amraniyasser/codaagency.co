<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Coda Agency — Création de sites web avec une structure pensée pour le SEO, le GEO et les moteurs IA." />
  <title>Coda Agency — Création de sites web</title>

  <style>
    /* 1. TOKENS */
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0066cc;
      --border: rgba(29, 29, 31, 0.10);
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      --gutter: clamp(48px, 5vw, 96px);
      --nav-h: 88px;
      --radius-pill: 999px;
    }

    /* 2. BASE */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .inner {
      width: 100%;
      padding-inline: var(--gutter);
      margin-inline: auto;
    }

    /* 3. NAVBAR */
    .nav {
      height: var(--nav-h);
      display: flex;
      align-items: center;
    }

    .nav-inner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      white-space: nowrap;
      color: var(--text);
    }

    .brand-coda {
      font-size: 24px;
      font-weight: 400;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
    }

    .brand-agency {
      margin-top: 6px;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.38em;
      padding-left: 0.38em;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .nav-cta {
      min-height: 48px;
      padding: 0 22px;
      border-radius: var(--radius-pill);
      background: var(--text);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* 4. HERO INTRO */
    .hero-intro {
      padding-top: clamp(34px, 5vw, 72px);
      padding-bottom: clamp(42px, 6vw, 84px);
    }

    .hero-intro h1 {
      margin: 0;
      font-size: clamp(58px, 7vw, 108px);
      line-height: 0.95;
      letter-spacing: -0.06em;
      font-weight: 700;
      white-space: nowrap;
    }

    .hero-intro p {
      margin: 26px 0 0;
      max-width: 760px;
      font-size: clamp(18px, 1.7vw, 24px);
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--muted);
    }

    /* 5. RADIAL WORK SLIDER */
    .work-scroll {
      position: relative;
      height: 360vh;
    }

    .work-stage {
      position: sticky;
      top: 0;
      height: 100vh;
      min-height: 720px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .work-stage::before {
      content: "";
      position: absolute;
      inset: 8% var(--gutter) 7%;
      border-radius: 44px;
      background:
        radial-gradient(circle at 50% 45%, rgba(0,102,204,0.08), transparent 34%),
        var(--surface);
      border: 1px solid var(--border);
    }

    .radial-slider {
      position: relative;
      width: min(1120px, calc(100vw - (var(--gutter) * 2)));
      height: min(700px, 76vh);
      z-index: 1;
    }

    .radial-card {
      position: absolute;
      left: 50%;
      top: 49%;
      width: clamp(300px, 35vw, 520px);
      aspect-ratio: 1.5 / 1;
      border-radius: 30px;
      background: #fff;
      border: 1px solid rgba(29,29,31,0.10);
      box-shadow: 0 30px 90px rgba(29,29,31,0.10);
      transform-origin: center center;
      will-change: transform, opacity;
      transition: box-shadow 300ms ease, border-color 300ms ease;
    }

    .radial-card.is-active {
      border-color: rgba(29,29,31,0.16);
      box-shadow: 0 42px 110px rgba(29,29,31,0.16);
    }

    .slider-ui {
      position: absolute;
      left: 50%;
      bottom: 10.5%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .slider-index {
      min-width: 58px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      letter-spacing: 0.04em;
    }

    .slider-next {
      border: 0;
      border-radius: var(--radius-pill);
      background: var(--text);
      color: #fff;
      min-height: 48px;
      padding: 0 22px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .slider-next:hover {
      transform: translateY(-1px);
    }

    .slider-next:active {
      transform: translateY(0);
    }

    /* 6. RESPONSIVE */
    @media (max-width: 980px) {
      :root {
        --nav-h: 80px;
      }

      .hero-intro h1 {
        white-space: normal;
      }

      .work-scroll {
        height: 300vh;
      }

      .work-stage {
        min-height: 640px;
      }

      .radial-slider {
        height: 68vh;
      }
    }

    @media (max-width: 700px) {
      :root {
        --gutter: 24px;
      }

      .brand-coda {
        font-size: 20px;
      }

      .brand-agency {
        margin-top: 4px;
        font-size: 7px;
      }

      .nav-link {
        display: none;
      }

      .nav-cta {
        min-height: 44px;
        padding-inline: 16px;
        font-size: 12px;
      }

      .hero-intro {
        padding-top: 28px;
        padding-bottom: 38px;
      }

      .hero-intro h1 {
        font-size: clamp(44px, 13vw, 68px);
      }

      .hero-intro p {
        margin-top: 20px;
        font-size: 17px;
      }

      .work-scroll {
        height: 270vh;
      }

      .work-stage {
        min-height: 580px;
      }

      .work-stage::before {
        inset: 6% 14px 5%;
        border-radius: 30px;
      }

      .radial-slider {
        width: calc(100vw - 28px);
        height: 64vh;
      }

      .radial-card {
        width: min(78vw, 360px);
        border-radius: 22px;
      }

      .slider-ui {
        bottom: 8%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .radial-card,
      .slider-next {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <header class="nav">
    <div class="inner nav-inner">
      <a class="brand" href="#top" aria-label="Coda Agency — accueil">
        <span class="brand-coda">CODA</span>
        <span class="brand-agency">AGENCY</span>
      </a>

      <nav class="nav-actions" aria-label="Navigation principale">
        <a class="nav-link" href="#contact">Contact</a>
        <a class="nav-cta" href="#contact">Parler de votre projet <span aria-hidden="true">↗</span></a>
      </nav>
    </div>
  </header>

  <main id="top">
    <section class="hero-intro inner" aria-labelledby="hero-title">
      <h1 id="hero-title">Création de sites web.</h1>
      <p>Création de sites web avec une structure parfaitement pensée pour le SEO, le GEO et les moteurs IA.</p>
    </section>

    <section class="work-scroll" id="work" aria-label="Aperçu de nos réalisations">
      <div class="work-stage">
        <div class="radial-slider" aria-live="polite">
          <article class="radial-card" aria-label="Projet 1"></article>
          <article class="radial-card" aria-label="Projet 2"></article>
          <article class="radial-card" aria-label="Projet 3"></article>
          <article class="radial-card" aria-label="Projet 4"></article>
          <article class="radial-card" aria-label="Projet 5"></article>
        </div>

        <div class="slider-ui">
          <span class="slider-index" aria-hidden="true">01 / 05</span>
          <button class="slider-next" type="button" aria-label="Voir le projet suivant">
            Next <span aria-hidden="true">→</span>
          </button>
        </div>
      </div>
    </section>

    <section id="contact"></section>
  </main>

  <script>
    (() => {
      const section = document.querySelector('.work-scroll');
      const cards = [...document.querySelectorAll('.radial-card')];
      const nextButton = document.querySelector('.slider-next');
      const indexLabel = document.querySelector('.slider-index');
      const count = cards.length;

      let manualIndex = 0;
      let scrollIndex = 0;
      let activeIndex = 0;
      let lastScrollY = window.scrollY;
      let scrollTimer;
      let isScrolling = false;

      const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

      function setActive(index, smooth = true) {
        activeIndex = ((index % count) + count) % count;
        manualIndex = activeIndex;

        cards.forEach((card, i) => {
          let offset = i - activeIndex;
          if (offset > count / 2) offset -= count;
          if (offset < -count / 2) offset += count;

          const angle = offset * 23;
          const radians = angle * Math.PI / 180;
          const radiusX = window.innerWidth < 700 ? 260 : 430;
          const radiusY = window.innerWidth < 700 ? 145 : 220;

          const x = Math.sin(radians) * radiusX;
          const y = (1 - Math.cos(radians)) * radiusY - Math.abs(offset) * 6;
          const rotate = offset * 7;
          const scale = 1 - Math.min(Math.abs(offset) * 0.09, 0.28);
          const opacity = clamp(1 - Math.abs(offset) * 0.22, 0.28, 1);
          const z = 20 - Math.abs(offset);

          card.style.transition = smooth
            ? 'transform 620ms cubic-bezier(.2,.8,.2,1), opacity 420ms ease'
            : 'none';
          card.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px) rotate(${rotate}deg) scale(${scale})`;
          card.style.opacity = opacity;
          card.style.zIndex = z;
          card.classList.toggle('is-active', i === activeIndex);
        });

        indexLabel.textContent = `${String(activeIndex + 1).padStart(2, '0')} / ${String(count).padStart(2, '0')}`;
      }

      function updateFromScroll() {
        const rect = section.getBoundingClientRect();
        const scrollable = section.offsetHeight - window.innerHeight;
        const progress = clamp(-rect.top / scrollable, 0, 1);
        const raw = progress * (count - 1);
        const nextIndex = Math.round(raw);

        if (nextIndex !== scrollIndex) {
          scrollIndex = nextIndex;
          setActive(scrollIndex, true);
        }
      }

      window.addEventListener('scroll', () => {
        isScrolling = true;
        lastScrollY = window.scrollY;
        updateFromScroll();

        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(() => {
          isScrolling = false;
        }, 180);
      }, { passive: true });

      nextButton.addEventListener('click', () => {
        const next = (activeIndex + 1) % count;
        setActive(next, true);

        if (!isScrolling) {
          manualIndex = next;
        }
      });

      window.addEventListener('resize', () => setActive(activeIndex, false));

      setActive(0, false);
      updateFromScroll();
    })();
  </script>
</body>
</html>
